<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440"  role="img" aria-labelledby="t d">
  <title id="t">nextcloud-ai-auto-tag</title>
  <desc id="d">Photos and videos go through a local vision model served by llama.cpp and come back as tags on your self-hosted cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2540"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <clipPath id="c1"><rect x="0" y="0" width="150" height="110" rx="12"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#fff">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280"/>
    <path d="M160 0V440M320 0V440M480 0V440M640 0V440M800 0V440M960 0V440M1120 0V440"/>
  </g>

  <text x="64" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">nextcloud-ai-auto-tag</text>
  <text x="64" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Tag your photos and videos with a local vision model. No cloud AI, no uploads.</text>

  <!-- photos -->
  <g filter="url(#shadow)">
    <g transform="translate(92 200) rotate(-8 75 55)">
      <rect width="150" height="110" rx="12" fill="url(#sky2)"/>
      <circle cx="104" cy="38" r="16" fill="#fde68a"/>
      <path d="M0 110 L46 56 L82 92 L108 68 L150 110 Z" fill="#312e81" clip-path="url(#c1)"/>
    </g>
    <g transform="translate(150 232) rotate(5 75 55)">
      <rect width="150" height="110" rx="12" fill="url(#sky)"/>
      <circle cx="40" cy="36" r="15" fill="#fff7d6"/>
      <path d="M0 110 L58 50 L98 92 L122 74 L150 110 Z" fill="#14532d" clip-path="url(#c1)"/>
    </g>
    <g transform="translate(112 276)">
      <rect width="150" height="110" rx="12" fill="#1f2937" stroke="#475569" stroke-width="2"/>
      <rect x="10" y="10" width="130" height="90" rx="8" fill="#334155"/>
      <circle cx="75" cy="55" r="24" fill="#0f172a" fill-opacity="0.65"/>
      <path d="M67 42 L67 68 L90 55 Z" fill="#f8fafc"/>
    </g>
  </g>

  <path d="M330 300 H452" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)" fill="none"/>

  <!-- model -->
  <g filter="url(#shadow)">
    <rect x="470" y="212" width="236" height="156" rx="22" fill="url(#chip)"/>
    <g stroke="#0b1220" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <path d="M498 198V212M538 198V212M578 198V212M618 198V212M658 198V212M686 198V212"/>
      <path d="M498 368V382M538 368V382M578 368V382M618 368V382M658 368V382M686 368V382"/>
      <path d="M456 240H470M456 280H470M456 320H470M456 350H470"/>
      <path d="M706 240H720M706 280H720M706 320H720M706 350H720"/>
    </g>
    <rect x="490" y="232" width="196" height="116" rx="14" fill="#0b1220" fill-opacity="0.55"/>
    <text x="588" y="278" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#f8fafc">d1-Omni 2B</text>
    <text x="588" y="308" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a5f3fc">llama.cpp</text>
    <text x="588" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">your own GPU</text>
  </g>

  <path d="M726 300 H842" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)" fill="none"/>

  <!-- cloud with tags -->
  <g filter="url(#shadow)">
    <path d="M900 396 H1190 A64 64 0 0 0 1196 268 A92 92 0 0 0 1020 232 A84 84 0 0 0 900 396 Z" fill="url(#cloud)" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="936" y="268" width="92" height="32" rx="16" fill="#0f766e"/>
    <text x="982" y="290" text-anchor="middle" fill="#ccfbf1">beach</text>
    <rect x="1040" y="268" width="70" height="32" rx="16" fill="#4338ca"/>
    <text x="1075" y="290" text-anchor="middle" fill="#e0e7ff">dog</text>
    <rect x="1122" y="268" width="62" height="32" rx="16" fill="#a16207"/>
    <text x="1153" y="290" text-anchor="middle" fill="#fef3c7">sun</text>
    <rect x="936" y="312" width="124" height="32" rx="16" fill="#0369a1"/>
    <text x="998" y="334" text-anchor="middle" fill="#e0f2fe">screenshot</text>
    <rect x="1072" y="312" width="112" height="32" rx="16" fill="#991b1b"/>
    <text x="1128" y="334" text-anchor="middle" fill="#fee2e2">to delete?</text>
  </g>
  <text x="1046" y="378" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#93c5fd">self-hosted Nextcloud</text>

  <text x="64" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Proposes, never deletes. Every tag it adds is journaled and reversible.</text>
</svg>
