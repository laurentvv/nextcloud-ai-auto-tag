[project]
name = "nc-autotag"
version = "0.1.0"
description = "Tag the photos and videos of a self-hosted Nextcloud with a local vision model (Liquid AI d1-Omni via llama.cpp). Proposes, never deletes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "laurentvv" }]
keywords = ["nextcloud", "photo-tagging", "auto-tagging", "llama-cpp", "liquid-ai", "lfm", "vision-language-model", "image-classification", "video", "duplicate-detection", "webdav", "self-hosted", "gguf", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving",
]
requires-python = ">=3.15"
dependencies = [
    "httpx",
    "asyncssh",
    "pillow",
    "pillow-heif",
    "pydantic",
    "pydantic-settings",
    "typer",
    "pyyaml",
    "keyring",
    "rich",
]

[project.urls]
Homepage = "https://github.com/laurentvv/nextcloud-ai-auto-tag"
Issues = "https://github.com/laurentvv/nextcloud-ai-auto-tag/issues"

[project.scripts]
nc-autotag = "nc_autotag.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_autotag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: nécessite un llama-server d1-Omni sur 127.0.0.1:8080"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_webdav.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
